<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="24" y1="17" x2="29" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="20" y="13.5" width="13" height="13" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base squircle background -->
  <rect width="40" height="40" rx="10" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border line -->
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="9.25" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Precision Monogram "ND" -->
  <path
    d="M 11 29 V 11 L 20.5 29 V 11 H 25.5 C 29.8 11 33 14.2 33 20 C 33 25.8 29.8 29 25.5 29 H 20.5"
    stroke="#F8FAFC"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Glowing Accent Dot -->
  <circle cx="26.5" cy="20" r="2.2" fill="url(#accentGrad)" filter="url(#glow)"/>
</svg>